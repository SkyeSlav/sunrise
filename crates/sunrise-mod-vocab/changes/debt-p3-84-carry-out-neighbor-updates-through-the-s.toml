ids = ["hook:affect_neighbors_after_removal", "method:BlockPart::affect_neighbors_after_removal", "type:AffectNeighborsAfterRemovalEvent", "type:AffectNeighborsAfterRemovalEvent.updates"]
why = "affect_neighbors_after_removal no longer collects NeighbourUpdate commands for the level to replay. The part gets the level's write host at the removal site, as Block.affectNeighborsAfterRemoval has the Level, and calls update_neighbors (Level.updateNeighborsAt, updateNeighborsAtExceptFromFacing, updateNeighbourForOutputSignal) itself; each call is applied at once through the level's normal update path, in call order, with vanilla's recursion."
migrate = "Take the write host (&mut dyn LevelWriteHost) as the first parameter instead of &dyn LevelHost, and replace each event.updates.push(update) with level.update_neighbors(pos, state, update) in the same order; the updates field no longer exists."
