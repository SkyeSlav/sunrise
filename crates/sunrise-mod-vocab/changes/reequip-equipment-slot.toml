ids = ["hook:should_cause_reequip_animation"]
why = "should_cause_reequip_animation version 2 follows NeoForge's ClientHooks.shouldCauseReequipAnimation: it is asked after vanilla's instant replacements on every tick the hands aren't busy, main hand then off hand, whenever both stacks are non-empty (equal stacks too), and only the parts of the shown item (`old`) are asked. `old` is no longer optional, the event gains `slot: EquipmentSlot`, and `slot_changed` compares the selected slot with the previous main-hand check's. Each part gets the original inputs."
migrate = "Rebuild against this SDK. Attach the part to the item whose departure decides the animation (the shown stack), read `event.old` without unwrapping, and return vanilla's answer for equal stacks unless the hand should dip."
