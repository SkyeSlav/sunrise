why = "BlockPart::fall_on and BlockPart::bounce_on now take a live ServerHost with LevelRef and EntityRef handles instead of deferred LandingWrite commands, so world and entity mutations run synchronously at vanilla's fallOn/bounceOn call sites. LandingWrite is retired; StepOnEvent::request now takes InsideWrite."
migrate = "Update BlockPart::fall_on and BlockPart::bounce_on signatures to take &mut dyn ServerHost, use event.level and event.entity directly instead of event.request/dimension/kind, and pass InsideWrite to StepOnEvent::request."
