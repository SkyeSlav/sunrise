ids = ["hook:entity_tick_pre", "hook:entity_tick_post"]
why = "Version 5 extends client-side entity_tick_pre and entity_tick_post to every entity the client ticks (vanilla ClientLevel.tickNonPassenger / tickPassenger and NeoForge's ClientLevel and Entity.rideTick patches), including the local player (in addition to player_tick_pre and player_tick_post), items, experience orbs, primed TNT, falling blocks, driven and observed vehicles, armor stands, general entity rows, and other tracked entities. On a frozen client level, players and entities in a player-bearing passenger tree still fire. A passenger counts its tick in Entity.commonTick before its Pre inside Entity.rideTick and is still positioned by its vehicle when canceled."
migrate = "Rebuild against this SDK. Client-side listeners to entity_tick_pre and entity_tick_post now hear the local player and all other entities the client ticks, not only mobs, remote players, projectiles, tridents, and displays. Filter by event.kind or entity id if only specific families are wanted."
