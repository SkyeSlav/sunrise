ids = ["type:SpawnGroup.Wolf"]
why = "Wolf variants now load from the world's data packs into the minecraft:wolf_variant registry, matching vanilla 26.3. SpawnGroup::Wolf { variant } resolves against the world's minecraft:wolf_variant registry instead of a fixed vanilla list, accepting pack-added variant ids and refusing ids the registry lacks."
migrate = "No type or signature change. Mods that pass or inspect SpawnGroup::Wolf { variant } may now see non-minecraft variant ids from data packs, and an id absent from the world's minecraft:wolf_variant registry is refused."
