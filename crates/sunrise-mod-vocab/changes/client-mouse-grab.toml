ids = ["method:prelude::ClientInputClientHost::is_mouse_grabbed", "method:prelude::ClientInputClientHost::set_mouse_grabbed"]
why = "A client mod reads whether the window holds the pointer and grabs or releases it as vanilla does (MouseHandler.isMouseGrabbed, grabMouse, releaseMouse): grabbing does nothing when the window is inactive or the pointer is already grabbed and otherwise closes the open screen and takes the pointer, releasing does nothing when it is not grabbed."
migrate = "Additive: nothing to change."
