ids = ["hook:dispenser_acts", "hook:dispense_method", "hook:dispense_item"]
why = "Adds the global server replace hook dispenser_acts, version 1, at DispenserBlock.getDispenseMethod: every subscribed mod is asked in order once a dispenser has picked a non-empty slot, and the first answer the game accepts replaces the faced block's and the item's Part answers and vanilla's behaviour. dispense_method and dispense_item version 5 are therefore asked only when no dispenser_acts answer was accepted, and, like vanilla's behaviours, not at all for an item the world's feature flags disable, which is dropped as DefaultDispenseItemBehavior drops it."
migrate = "Rebuild against this SDK. A dispense_method or dispense_item Part that must run for every item now also loses to a dispenser_acts answer; move behaviour that should win over other mods' Parts to dispenser_acts."
