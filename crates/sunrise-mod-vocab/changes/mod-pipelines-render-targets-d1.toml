why = "Add mod-owned offscreen render targets (RenderTargetRef, RenderTargetDescriptor, RenderTargetFormat, RenderTargetDepth, RenderTargetError, RenderTargetContext, OffscreenPass), TextureSource::RenderTargetColor/RenderTargetDepth sampling, and PipelineDrawError::TargetReadWriteHazard self-sampling refusal (#5429). Targets always retain contents across frames until cleared or resized (no persistent flag); world offscreen passes flow through frame_graph_setup and PiP renderers use OffscreenPass directly."
migrate = "Additive API. Allocate offscreen targets with host.create_render_target(&desc), manage them via handle methods (target.resize(host, size), target.size(host), target.release(host)), and sample them in mod pipelines via TextureSource::RenderTargetColor(target, attachment) and TextureSource::RenderTargetDepth(target)."
