ids = ["hook:anvil_craft_pre", "type:item::menu::AnvilCraftInputs", "type:item::menu::AnvilCraftInputs.xp_cost", "type:item::menu::AnvilCraftInputs.material_cost"]
why = "`AnvilCraftInputs` gains `xp_cost` and `material_cost`, the values `AnvilMenu.onTake` reads as `cost` and `repairItemCountCost` (NeoForge's `AnvilCraftEvent.Pre` listeners read them from `event.getMenu()`), so a listener that cancels `anvil_craft_pre` can do the take itself: charge the levels, use up the material, empty the left stack and wear the anvil. `anvil_craft_pre` is version 4; `anvil_craft_post` borrows the same struct and sees the same two values."
migrate = "Rebuild against the current SDK. A mod that builds an `AnvilCraftInputs` literal adds the two fields; a listener that only reads `left`, `right` and `output` compiles unchanged. A listener that cancels `anvil_craft_pre` and skipped the take's effects can now charge `xp_cost` levels (unless the player has infinite materials) and take `material_cost` from the right stack."
