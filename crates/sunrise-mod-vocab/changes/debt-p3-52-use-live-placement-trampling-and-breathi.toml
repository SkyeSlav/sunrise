ids = ["hook:farmland_trample", "hook:living_breathe", "hook:placement_context"]
why = "Placement, trampling and breathing now follow NeoForge's moments with the live subject. farmland_trample and living_breathe no longer wrap the listener in a rollback transaction: its writes stand as in CommonHooks.onFarmlandTrample and onLivingBreathe, and the game only re-checks what the operation reads (the entity still there, the block still the decided state, the air unchanged). player_place_block runs Block.setPlacedBy with the placing player as BlockItem.place does. placement_context no longer refuses a replacement that names another item; the placement uses the replacement's position, click and rotation with the placing stack."
migrate = "A listener of farmland_trample or living_breathe that relied on its writes being rolled back when the trample or the air update was refused must undo them itself. A listener of set_placed_by sees the placing player for a block written by player_place_block. A placement_context replacement that changed the item is now applied instead of refused."
