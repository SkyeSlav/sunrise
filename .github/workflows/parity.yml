name: vanilla parity
# Every vanilla differential harness that runs in CI, on one commit: called by daily.yml on main's head (every harness)
# and by dyna-ci.yml's dispatch with `parity` (main's head, the fixed set or named harnesses). Never on a pull request
# or a rollup (owner, 2026-11-17).
# Vanilla's data and the harnesses' output (vanilla's values) stay on the runner: the log gets PASS/FAIL lines only.
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to test
        type: string
        required: true
      harnesses:
        description: "'' the fixed set; `all` every harness (tools/parity.py --all); else these names, space-separated"
        type: string
        default: ''
      report:
        description: Write the harnesses' verdicts as the daily-report-parity artifact (names and pass/fail only)
        type: boolean
        default: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  vanilla-parity:
    runs-on: dyna-large
    # Every harness (`all`) takes about 11 harness-hours, 4 at a time (tools/parity.py -j 4); a runner ends at 6 h.
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      # Written from this workflow's own revision, never from the tested tree: an older head's helper would stream a
      # harness's output (vanilla's values) into the public log. Every `python` this job's steps run goes to a log on
      # the runner's slot; the job log gets the harness names with PASS or FAIL, and the exit status is kept. A failure's
      # logs (a failing script's, and each failing harness's from tools/parity.py) are copied to the slot's parity-keep,
      # per run and attempt, which the next job's setup does not wipe, so they can still be read on the host after the slot is reused.
      # A failure's cause in the compiler's, Cargo's or the test runner's fixed forms (a crate that did not compile, a
      # process killed by a signal, an error code's source line, a failed test's name, a panic's location, a timeout)
      # is printed too, rebuilt from parts that match only names, numbers and source paths, so no other text of the log
      # (a value a harness printed) can pass.
      - name: Keep harness output on the runner
        run: |
          mkdir -p "$DYNA_CI_BUILD/bin"
          # The slot persists: an older job left bin/python as a link into its own checkout, which `cat >` would follow.
          rm -f "$DYNA_CI_BUILD/bin/python"
          cat > "$DYNA_CI_BUILD/bin/python" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          mkdir -p "$DYNA_CI_BUILD/parity-logs"
          name=$(basename "${1:-python}" .py)
          log="$DYNA_CI_BUILD/parity-logs/$name.log"
          /usr/bin/python3 "$@" > "$log" 2>&1
          status=$?
          rm -rf "$DYNA_CI_BUILD"/parity-out/rust-*
          causes() {
            sed -nE \
              -e 's/.*could not compile `([A-Za-z0-9_-]+)` \(([a-z ]+)\).*/could not compile \1 (\2)/p' \
              -e 's/.*--crate-name ([A-Za-z0-9_]+) .*\(signal: ([0-9]+), (SIG[A-Z]+).*/rustc for \1 killed by signal \2 (\3)/p' \
              -e 's/.*process didn.t exit successfully: `[^ `]*\/deps\/([A-Za-z0-9_]+)-[0-9a-f]+[ `].*\(signal: ([0-9]+), (SIG[A-Z]+).*/test binary \1 killed by signal \2 (\3)/p' \
              -e 's/^(error\[E[0-9]{4}\]).*/\1/p' \
              -e 's/^ *--> ([A-Za-z0-9_.\/-]+\.rs:[0-9]+:[0-9]+)$/  at \1/p' \
              -e 's/^test ([A-Za-z0-9_:]+) \.\.\. FAILED$/test \1 FAILED/p' \
              -e 's/.*panicked at ([A-Za-z0-9_.\/-]+\.rs:[0-9]+:[0-9]+).*/panicked at \1/p' \
              -e 's/^--- [a-z0-9_#]+: timed out after ([0-9]+)s$/timed out after \1 s/p' \
              "$1" | awk '!seen[$0]++' | head -n 12 | sed "s/^/  $2: /"
          }
          if [ "$name" = parity ]; then grep -aoE '^(PASS|FAIL|RETRIED|FLAKY) [a-z0-9_#]+' "$log" || true; fi
          keep="$DYNA_CI_BUILD/parity-keep/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # A harness that failed and then passed its one retry leaves its first run's log aside (tools/parity.py
          # keep_first_log): keep that too, whatever the exit status, so a one-off failure can still be read.
          if [ "$name" = parity ]; then
            for harness in $(grep -aoE '^RETRIED [a-z0-9_#]+' "$log" | cut -d' ' -f2 | sort -u); do
              for first in "$GITHUB_WORKSPACE/.local/parity-runner/logs/$harness".first-run.log \
                  "$GITHUB_WORKSPACE/.local/parity-runner/logs/$harness"~*.first-run.log; do
                [ -f "$first" ] || continue
                mkdir -p "$keep"
                cp "$first" "$keep/"
                causes "$first" "$harness (first run)"
                echo "  $harness: its first run's log is kept on runner $RUNNER_NAME in $keep"
              done
            done
          fi
          if [ "$status" -eq 0 ]; then echo "PASS $name"; exit 0; fi
          mkdir -p "$keep"
          cp "$log" "$keep/"
          if [ "$name" = parity ]; then
            for harness in $(grep -aoE '^FAIL [a-z0-9_#]+' "$log" | cut -d' ' -f2 | sort -u); do
              cp "$GITHUB_WORKSPACE/.local/parity-runner/logs/$harness.log" "$keep/" 2>/dev/null || true
              [ -f "$keep/$harness.log" ] && causes "$keep/$harness.log" "$harness"
            done
          else
            causes "$log" "$name"
          fi
          echo "FAIL $name (exit $status; its logs are kept on runner $RUNNER_NAME in $keep)"
          exit "$status"
          SH
          chmod +x "$DYNA_CI_BUILD/bin/python"
          echo "$DYNA_CI_BUILD/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Set up disk-backed parity scratch and prepared vanilla data
        run: |
          rm -rf "$DYNA_CI_BUILD/parity-out" "$DYNA_CI_BUILD/parity-tmp" "$DYNA_CI_BUILD/parity-logs"
          mkdir -p "$DYNA_CI_BUILD/parity-out" "$DYNA_CI_BUILD/parity-tmp" "$DYNA_CI_BUILD/parity-logs"
          ln -s "$DYNA_CI_BUILD/parity-out" .local
          # The probes' build folder (tools/parity.py's .local/parity-target) lives under the slot's persistent target,
          # so a run rebuilds only what changed instead of the whole game from cold (a harness's own 900 s build limit
          # ran out on that, 2026-11-16). The source snapshot step above keeps it true across trees.
          mkdir -p "$CARGO_TARGET_DIR/parity"
          ln -s "$CARGO_TARGET_DIR/parity" .local/parity-target
          echo "TMPDIR=$DYNA_CI_BUILD/parity-tmp" >> "$GITHUB_ENV"
          # tools/parity.py keeps pass records beside .local/minecraft, which is the read-only cache and holds
          # other trees' passes: this run's records start empty, on the slot.
          echo "PARITY_SHARED=$DYNA_CI_BUILD/parity-out/shared" >> "$GITHUB_ENV"
          SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
      # The game opens a window even with --offscreen, and the runner has no display: a virtual X display for every
      # harness, started from this workflow and left running for the job.
      - name: Virtual display
        run: |
          Xvfb -displayfd 3 -screen 0 1280x1024x24 -nolisten tcp 3> "$RUNNER_TEMP/xvfb-display" > /dev/null 2>&1 &
          for _ in $(seq 60); do [ -s "$RUNNER_TEMP/xvfb-display" ] && break; sleep 0.5; done
          [ -s "$RUNNER_TEMP/xvfb-display" ] || { echo "::error::Xvfb did not report a display within 30 seconds"; exit 1; }
          echo "DISPLAY=:$(tr -d '[:space:]' < "$RUNNER_TEMP/xvfb-display")" | tee -a "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=" >> "$GITHUB_ENV"
      # The game-probe builds the named harnesses run, built here first, as tools/parity.py runs them (its target and
      # profile), so a cold build never counts against a harness's own build limit.
      - name: Build the named harnesses' game probes
        if: inputs.harnesses != ''
        env:
          HARNESSES: ${{ inputs.harnesses }}
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_INCREMENTAL: 'true'
          CARGO_PROFILE_DEV_OPT_LEVEL: '3'
        run: |
          export CARGO_TARGET_DIR="$PWD/.local/parity-target"
          read -ra names <<< "$HARNESSES"
          scripts=()
          if [ "$HARNESSES" = all ]; then
            scripts=(tools/test_*_parity.py)
            names=()
          fi
          for name in "${names[@]}"; do
            [[ "$name" =~ ^[a-z0-9_]+(#[0-9]+)?$ ]] || { echo "::error::not a harness name: $name"; exit 1; }
            script="tools/test_${name%%#*}_parity.py"
            [ -f "$script" ] && scripts+=("$script")
          done
          [ "${#scripts[@]}" -gt 0 ] || exit 0
          started=$SECONDS
          if grep -q "'--example', 'client_probe'" "${scripts[@]}"; then
            cargo build --profile fast -p sunrise-client-lib --example client_probe
          fi
          if grep -q "'sunrise-game', '-p', 'sunrise-client-lib', '--bins'" "${scripts[@]}"; then
            cargo build --locked --profile fast -p sunrise-game -p sunrise-client-lib --bins
          fi
          if grep -Eq "[\"']sunrise-game[\"'], [\"']--bin[\"'], [\"']sunrise-client[\"']" "${scripts[@]}"; then
            cargo build --profile fast -p sunrise-game --bin sunrise-client
          fi
          # The client lib tests harnesses run (`cargo test -p <package> --lib`, the dev profile as parity.py sets it),
          # one at a time and before any oracle starts: one rustc of up to 12 GiB each, which a 16 GiB runner
          # killed beside the harnesses (signal 9: mount_control and damage_catalog on main, 2026-11-16).
          for package in sunrise-client-lib sunrise-client; do
            if grep -Eq "[\"']test[\"'], ([\"']--locked[\"'], )?[\"']-p[\"'], [\"']$package[\"'], [\"']--lib[\"']" "${scripts[@]}"; then
              cargo test --locked --no-run -p "$package" --lib
            fi
          done
          echo "Game probe builds: $((SECONDS - started)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Named harnesses
        if: inputs.harnesses != '' && inputs.harnesses != 'all'
        env:
          HARNESSES: ${{ inputs.harnesses }}
          PARITY_HOSTS: ''
        run: |
          read -ra names <<< "$HARNESSES"
          for name in "${names[@]}"; do
            [[ "$name" =~ ^[a-z0-9_]+(#[0-9]+)?$ ]] || { echo "::error::not a harness name: $name"; exit 1; }
          done
          python tools/parity.py -j 4 --timeout 2400 "${names[@]}"
      # Harness subprocess timeouts can be shorter than a cold release build. Match their build commands and target dir.
      - name: Build parity probes
        if: inputs.harnesses == '' || inputs.harnesses == 'all'
        run: |
          cargo build --release --bin sunrise-parity
          cargo build --release --bin sunrise-tick-parity
          cargo build --release --bin sunrise-geometry-parity
          cargo build --release --bin sunrise-noise-parity
          cargo build --release --bin sunrise-density-parity
          cargo build --release --bin sunrise-worldgen-parity
          cargo build --release --bin sunrise-float-log-parity
          cargo build --release -p sunrise-core --example generation_tick_fixture
          cargo build --release -p sunrise-core --example biome_zoom_fixture
          cargo build --release -p sunrise-world --bin sunrise-world --example world_probe
          cargo build --release -p sunrise-world --example world_probe
      # The daily run: every harness, ignoring earlier passes (the fixed-set steps below are among them).
      - name: Every harness
        if: inputs.harnesses == 'all'
        env:
          PARITY_HOSTS: ''
        run: python tools/parity.py --all -j 4 --timeout 2400
      - name: Compare Rust foundations with pinned vanilla client and server bytecode
        if: inputs.harnesses == ''
        run: python tools/test_rust_parity.py
      - name: Check Rust world-data interoperability with pinned vanilla client and server
        if: inputs.harnesses == ''
        run: python tools/test_world_parity.py
      - name: Compare scheduled ticks and saved tick data with pinned vanilla client and server
        if: inputs.harnesses == ''
        run: python tools/test_tick_parity.py
      - name: Compare simulation geometry and cached block collision shapes
        if: inputs.harnesses == ''
        run: |
          python tools/test_geometry_parity.py
          python tools/test_collision_parity.py
      - name: Compare noise samplers and density kernels with pinned vanilla client and server
        if: inputs.harnesses == ''
        run: python tools/test_noise_parity.py
      - name: Compare compiled density samplers with pinned vanilla client and server
        if: inputs.harnesses == ''
        run: python tools/test_density_parity.py
      - name: Compare world-generation JSON codecs with pinned vanilla client and server
        if: inputs.harnesses == ''
        run: python tools/test_worldgen_parity.py
      - name: Compare heightmap predicates and chunk mutations with pinned vanilla client and server
        if: inputs.harnesses == ''
        run: python tools/test_heightmap_parity.py
      - name: Compare pre-light chunk status transitions and block writes
