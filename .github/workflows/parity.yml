        if: inputs.harnesses == ''
        run: python tools/test_float_log_parity.py
      # The daily's verdict: harness names with pass or fail from tools/parity.py's log on the runner, nothing else
      # of it (tools/ci/parity_verdict.py); daily_summary.py --parity files an issue per failing harness from it.
      # python3, not the `python` above: this step's output is the verdict's, not a harness's.
      - name: Write the harnesses' verdict
        if: always() && inputs.report
        run: python3 tools/ci/parity_verdict.py "$DYNA_CI_BUILD/parity-logs/parity.log" "$RUNNER_TEMP/daily-report.json"
      - name: Upload the harnesses' verdict
        if: always() && inputs.report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-parity
          path: ${{ runner.temp }}/daily-report.json
          if-no-files-found: ignore
          retention-days: 7
      # Failure logs kept on the slot (see "Keep harness output on the runner") stay three days, then go.
      - name: Prune kept failure logs
        if: always()
        run: |
          keep="$DYNA_CI_BUILD/parity-keep"
          [ -d "$keep" ] || exit 0
          find "$keep" -mindepth 1 -maxdepth 1 -type d -mmin +4320 -exec rm -rf {} +
          if [ -d "$keep/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]; then
            echo "Failure logs of run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT are kept on runner $RUNNER_NAME in $keep/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
